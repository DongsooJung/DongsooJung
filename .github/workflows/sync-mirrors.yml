name: Sync Mirror Branches

on:
  push:
    branches: [main]
    paths:
      - 'repos/**'
      - 'scripts/sync-mirrors.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and push mirror branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/sync-mirrors.sh
          # workflow 내에서는 origin URL을 GITHUB_TOKEN으로 교체
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/DongsooJung/DongsooJung.git"
          ./scripts/sync-mirrors.sh

      - name: Try cross-repo deploy
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "${{ secrets.GH_PAT }}" ]]; then
            chmod +x scripts/deploy-mirrors.sh
            ./scripts/deploy-mirrors.sh
          else
            echo "::notice::GH_PAT 없음 — mirror 브랜치만 갱신됨. 로컬에서 scripts/deploy-mirrors.sh 실행 가능."
          fi
