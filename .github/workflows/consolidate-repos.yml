name: Verify Repository Bundles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'repos/**'
      - 'consolidation/**'
      - '.github/workflows/consolidate-repos.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify bundles
        run: |
          for b in consolidation/bundles/*.bundle; do
            echo "Verifying $b"
            git bundle verify "$b"
          done
          echo "Staging dirs:"
          ls -la repos/
