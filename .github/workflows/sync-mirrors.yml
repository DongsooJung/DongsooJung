name: Sync Snapshot Branches

on:
  push:
    branches: [main]
    paths:
      - 'repos/**'
      - 'scripts/sync-mirrors.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build snapshot branches only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "cursor-agent@users.noreply.github.com"
          git config --global user.name "Cursor Agent"
          chmod +x scripts/sync-mirrors.sh
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/DongsooJung/DongsooJung.git"
          ./scripts/sync-mirrors.sh

      - name: Production deployment policy
        run: |
          echo "::notice::Cross-repository deployment is disabled."
          echo "::notice::Edit and deploy each production domain from its canonical repository."
